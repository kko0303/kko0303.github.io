<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img"
     aria-label="チルトを15度刻みで決め、テント角を別軸で調整できる図">
  <defs>
    <style>
      .ln   { fill:none; stroke:#8f8d88; stroke-width:1.4 }
      .gold { fill:none; stroke:#c9a227; stroke-width:1.8 }
      .thin { fill:none; stroke:#c9a227; stroke-width:1; opacity:.55 }
      .kb   { fill:#2a2a33; stroke:#e6cf87; stroke-width:1.6 }
      .post { fill:#1c1c22; stroke:#8f8d88; stroke-width:1.4 }
      .t    { fill:#a7a49e; font:400 11px "Noto Sans JP",sans-serif; letter-spacing:.06em }
      .tg   { fill:#e6cf87; font:400 11px "Noto Sans JP",sans-serif; letter-spacing:.08em }
      .num  { fill:#c9a227; font:400 13px "Cormorant Garamond",serif; letter-spacing:.1em }
      .deg  { fill:#8f8d88; font:400 9px "Cormorant Garamond",serif }
    </style>
  </defs>

  <!-- 左：チルト -->
  <text class="num" x="4" y="16">01</text>
  <text class="tg"  x="26" y="16">チルト 15度刻み</text>

  <g transform="translate(96,150)">
    <!-- 支点 -->
    <circle cx="0" cy="0" r="5" fill="#c9a227"/>
    <circle cx="0" cy="0" r="13" class="thin"/>
    <!-- 目盛（0/15/30/45/60） -->
    <g class="thin">
      <path d="M0 0 L76 0"/>
      <path d="M0 0 L73.4 -19.7"/>
      <path d="M0 0 L65.8 -38"/>
      <path d="M0 0 L53.7 -53.7"/>
      <path d="M0 0 L38 -65.8"/>
    </g>
    <!-- 現在角（30度）にキーボード -->
    <g transform="rotate(-30)">
      <path class="gold" d="M0 0 H70"/>
      <rect class="kb" x="34" y="-19" width="52" height="16" rx="2"/>
    </g>
    <!-- 円弧 -->
    <path class="gold" d="M84 0 A84 84 0 0 0 42 -72.7"/>
    <text class="deg" x="88" y="4">0°</text>
    <text class="deg" x="46" y="-78">60°</text>
    <text class="t" x="-34" y="26">支点（歯で位置決め）</text>
  </g>

  <!-- 区切り -->
  <path class="ln" d="M210 30 V222" stroke-dasharray="2 5" opacity=".5"/>

  <!-- 右：テント -->
  <text class="num" x="232" y="16">02</text>
  <text class="tg"  x="254" y="16">テント角</text>

  <g transform="translate(316,120)">
    <!-- 水平基準 -->
    <path class="ln" d="M-72 44 H72" stroke-dasharray="3 4"/>
    <!-- 左右のキーボード半分を内側に起こす -->
    <g transform="translate(-40,30) rotate(-18)">
      <rect class="kb" x="-38" y="-11" width="76" height="16" rx="2"/>
    </g>
    <g transform="translate(40,30) rotate(18)">
      <rect class="kb" x="-38" y="-11" width="76" height="16" rx="2"/>
    </g>
    <path class="gold" d="M-64 22 A40 40 0 0 1 -34 6"/>
    <path class="gold" d="M64 22 A40 40 0 0 0 34 6"/>
    <text class="t" x="-70" y="66">手首をひねらない角度に</text>
  </g>

  <text class="t" x="26" y="238">2軸が独立しているので、片方を決めてからもう片方を追い込めます。</text>
</svg>
